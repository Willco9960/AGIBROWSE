<!doctype html><meta charset="utf-8"><title>Profile fixture loading</title>
<p>Isolated browser profile fixture.</p>
<script>
globalThis.profileProofStage = Number(new URL(location.href).searchParams.get('stage'));
globalThis.profileProofDone = false;
globalThis.profileProof = false;
globalThis.profileFailureCode = 0;
const fail = code => { globalThis.profileFailureCode = code; throw Error('fixture'); };
(async () => {
  const stage = globalThis.profileProofStage;
  const seed = [1, 2, 4].includes(stage);
  const expected = [1, 3, 7].includes(stage) ? 'human' : [2, 6, 8].includes(stage) ? 'agent' : 'user';
  const cachedResponse = expected === 'human' ? '1' : expected === 'agent' ? '2' : '3';
  const cookie = () => document.cookie.split('; ').find(x => x.startsWith('profile_fixture='))?.split('=')[1];
  const cache = await caches.open('profile-fixture-v1');
  const priorCache = await cache.match('/storage-fixture');
  if (seed) {
    if (cookie()) fail(1);
    if (localStorage.getItem('profile-fixture')) fail(2);
    if (priorCache) fail(3);
    document.cookie = `profile_fixture=${expected}; Max-Age=86400; SameSite=Strict; Path=/`;
    localStorage.setItem('profile-fixture', expected);
    await cache.put('/storage-fixture', new Response(expected));
  } else {
    if (cookie() !== expected) fail(1);
    if (localStorage.getItem('profile-fixture') !== expected) fail(2);
    if (!priorCache || await priorCache.text() !== expected) fail(3);
  }
  // Normal browser HTTP cache, independently checked by the loopback server's
  // request count. This is distinct from the CacheStorage API above.
  if (await (await fetch('/http-cache')).text() !== cachedResponse) fail(4);
  const denied = await new Promise(resolve => {
    const timeout = setTimeout(() => resolve(false), 5000);
    navigator.geolocation.getCurrentPosition(() => { clearTimeout(timeout); resolve(false); },
      error => { clearTimeout(timeout); resolve(error.code === error.PERMISSION_DENIED); });
  });
  if (!denied) fail(5);
  globalThis.profileProof = true;
})().catch(() => {}).finally(() => {
  globalThis.profileProofDone = true;
  document.title = 'AGI-BROWSE fixture ready';
});
</script>
